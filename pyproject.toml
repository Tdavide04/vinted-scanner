[project]
name = "vinted-scanner"
version = "0.3.0"
description = "Read-only search of the Vinted catalogue (anonymous session): Python library and command line tool"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32,<3",
]

[project.scripts]
vinted-scanner = "vinted_scanner.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=9.2.0",
    "ruff>=0.8",
    "types-requests>=2.32",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 160
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # expected request params and payloads read best on one line

[tool.mypy]
strict = true
files = ["src"]
